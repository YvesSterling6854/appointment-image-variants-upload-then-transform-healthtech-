[package]
name = "appointment-image-variants"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "1.0.69"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time"] }
